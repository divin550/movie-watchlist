<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahsi's Movie Watchlist</title>
    <!-- bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- css -->
    <link rel="stylesheet" href="style.css" />
    <!-- google fonts -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    </style>
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <aside class="sidebar" aria-label="Main navigation">
      <a class="sidebar-brand" href="#home">MOVIE<span>WATCH</span>LIST</a>

      <nav class="sidebar-nav" aria-label="Watchlist">
        <p class="sidebar-label">YOUR LIBRARY</p>
        <a class="sidebar-link active" href="#watchlist" aria-current="page">
          <i class="fa-solid fa-film" aria-hidden="true"></i>
          <span>My watchlist</span>
        </a>
        <a class="sidebar-link" href="#watched">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
          <span>Watched</span>
        </a>
        <a class="sidebar-link" href="#favorites">
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
          <span>Favorites</span>
        </a>
        <a class="sidebar-link" href="#to-watch">
          <i class="fa-solid fa-clock" aria-hidden="true"></i>
          <span>To Watch</span>
        </a>
      </nav>

      <div class="sidebar-add add-btn" aria-disabled="true">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span>Add a movie</span>
      </div>
    </aside>
    <main class="page-content" id="watchlist">
      <header class="topbar">
        <form class="search-form" role="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input
            class="search-input"
            type="search"
            name="search"
            placeholder="Search movies..."
            aria-label="Search movies"
          />
        </form>
        <div class="dropdown genre-dropdown">
          <button
            class="btn genre-btn dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            All Genres
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </div>
      </header>
      <div class="movie-details-panel">
        <div class="total-movies">
          <div class="icon-container1">
            <i class="fa-solid fa-film"></i>
          </div>
          <div class="total-movies-detail">
            <h6>Total movies</h6>
            <span><h5 class="total-movies-val">0</h5></span>
          </div>
        </div>
        <div class="watched">
          <div class="icon-container2">
            <i class="fa-solid fa-eye"></i>
          </div>
          <div class="watched-detail">
            <h6>Watched</h6>
            <span><h5 class="watched-val">0</h5></span>
          </div>
        </div>
        <div class="to-watch">
          <div class="icon-container3">
            <i class="fa-solid fa-clock" aria-hidden="true"></i>
          </div>
          <div class="to-watch-detail">
            <h6>To watch</h6>
            <span><h5 class="toWatched-val">0</h5></span>
          </div>
        </div>
      </div>
      <div class="movie-cards-container">
        
      </div>
    </main>
    <section
      class="model-overlay"
      id="add-movie"
      role="dialog"
      aria-modal="true"
      aria-labelledby="add-movie-title"
    >
      <div class="model-backdrop" aria-hidden="true"></div>
      <div class="model-panel">
        <div class="model-heading">
          <div>
            <p class="model-eyebrow">YOUR LIBRARY</p>
            <h1 id="add-movie-title">Add a movie</h1>
          </div>
        </div>
        <form class="movie-form" action="#watchlist" method="get">
          <label class="model-field model-field-wide">
            <span>Movie title</span>
            <input type="text" name="title" placeholder="e.g. The Grand Budapest Hotel" required class="title-input" />
          </label>
          <label class="model-field model-field-wide">
            <span>Poster image URL</span>
            <input type="text" name="poster" class="img-input" placeholder="folder/poster.jpg" />
          </label>
          <div class="model-field-row">
            <label class="model-field">
              <span>Genre</span>
              
          <select class="genre" name="genre" required>
           <option value="" selected disabled>Select a genre</option>
           <option value="Drama">Drama</option>
           <option value="Comedy">Comedy</option>
           <option value="Thriller">Thriller</option>
           <option value="Sci-Fi">Sci-Fi</option>
           <option value="Action">Action</option>
           <option value="Animation">Animation</option>
           <option value="Horror">Horror</option>
          </select>




            </label>
            <label class="model-field">
              <span>Release year</span>
              <input type="number" class="year-input" name="year" placeholder="2024" min="1888" max="2100" />
            </label>
          </div>
          <label class="model-field model-field-wide">
            <span>Rating (0–10)</span>
            <input type="number" class="rating-input" name="rating" placeholder="e.g. 8.5" min="0" max="10" step="0.1" />
          </label>
          <label class="model-field model-field-wide">
            <span>Status</span>
            <select class="status" name="status">
              <option value="false">To watch</option>
              <option value="true">Watched</option>
            </select>
          </label>
          <div class="model-actions">
            <button class="model-cancel">Cancel</button>
            <button class="model-save" type="submit">Add to watchlist</button>
          </div>
          
          </div>
        </form>
      </div>
    </section>
    
    <!-- JS -->
    <script src="script.js"></script>
    <!-- bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
